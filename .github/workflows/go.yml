name: Go

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "backend/**"
      - "cloud/**"
      - "pricing/**"
      - "frontend/src/api/schema.ts"
      - "package.json"
      - ".github/workflows/go.yml"

permissions:
  contents: read

# A newer commit on the same PR cancels that PR's older in-flight run; push
# runs on main keep their own group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-core:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Read the version from go.mod so CI can't drift from the module
          # (it previously pinned 1.22 while go.mod declared 1.25).
          go-version-file: backend/go.mod
          # Restore the module and build caches. `go test -race ./...` rebuilds
          # every dependency with race instrumentation, and modernc.org/sqlite
          # alone is minutes of that on a 4-vCPU runner: the SQLite package did
          # not start until ~5 minutes into a 20-minute Test step. The cache is
          # keyed on go.sum, so a dependency bump still gets a cold, correct
          # build.
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        if: matrix.shard == 0
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        if: matrix.shard == 0
        run: go build ./...

      - name: Vet
        if: matrix.shard == 0
        run: go vet ./...

      - name: Test
        # -count=1 disables Go's test-result cache. The build cache restored
        # above also carries test results between runs, and without this a run
        # reported 158 of 170 packages as (cached) without executing them. The
        # cache is content-aware for Go inputs but not for the things these
        # tests actually touch — subprocesses, PATH contents, the network — so
        # a required check must still run every test. Compilation stays cached.
        run: |
          packages=$(go list ./... | grep -v -e '/internal/storage/sqlite$' -e '/internal/service/chat$' -e '/internal/session_manager$' -e '/internal/storage/sqlite/store$')
          selected=$(printf '%s\n' "$packages" | awk -v shard=${{ matrix.shard }} '((NR - 1) % 2) == shard')
          test -n "$selected"
          printf '%s\n' "$selected" | xargs go test -race -count=1 -timeout=20m

  chat-race:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test chat
        run: |
          tests=$(go test -race -list . ./internal/service/chat | grep -E '^(Test|Example|Fuzz)')
          selected=$(printf '%s\n' "$tests" | awk -v shard=${{ matrix.shard }} '((NR - 1) % 2) == shard' | paste -sd '|' -)
          test -n "$selected"
          go test -race -count=1 -timeout=20m -run "^($selected)$" ./internal/service/chat

  session-store-race:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test session manager and SQLite store
        run: go test -race -count=1 -timeout=20m ./internal/session_manager ./internal/storage/sqlite/store

  sqlite-race:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test SQLite shard
        run: |
          tests=$(go test -race -list . ./internal/storage/sqlite | grep -E '^(Test|Example|Fuzz)')
          selected=$(printf '%s\n' "$tests" | awk -v shard=${{ matrix.shard }} '((NR - 1) % 4) == shard' | paste -sd '|' -)
          test -n "$selected"
          go test -race -count=1 -timeout=20m -run "^($selected)$" ./internal/storage/sqlite

  # Keep the existing required check as the gate for every backend race test.
  build-test:
    # Report neutral success while draft jobs are skipped or cancelled. On a
    # ready PR, always run so failed or cancelled required jobs fail the gate.
    if: always()
    needs: [backend-core, chat-race, session-store-race, sqlite-race]
    runs-on: ubuntu-latest
    steps:
      - name: Check backend results
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          test '${{ needs.backend-core.result }}' = success
          test '${{ needs.chat-race.result }}' = success
          test '${{ needs.session-store-race.result }}' = success
          test '${{ needs.sqlite-race.result }}' = success

  # The suite above only ever runs on Linux, so the packages whose behaviour is
  # genuinely platform-specific have never been exercised on Windows: worktree
  # teardown renames and unlinks directories, and Windows is the platform where
  # an open handle makes both fail. Scoped to those packages rather than the
  # whole suite to keep the matrix cheap.
  windows-workspace:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Scoped to teardown and kill by name rather than running these packages
      # whole: running them on Windows for the first time surfaced ten
      # pre-existing failures (agent switching, handoff artifacts, spawn PATH
      # and branch namespacing) that have nothing to do with worktree teardown.
      # Widening this is worth doing, but as its own change with its own fixes.
      - name: Test SQLite filesystem path identity
        run: go test -race -count=1 -run 'Test(OpenPreservesDataDirectoryCharacters|FragmentPathsKeepDatabasesIsolated|OpenRefusesToHideLegacyDatabase|OpenPrefersExistingIntendedDatabase|DatabaseURIPreservesWindowsPaths)$' ./internal/storage/sqlite

      - name: Test workspace teardown and session kill
        run: go test -race -count=1 -v -run 'Destroy|Discard|Sweep|Kill|RunPostCreate' ./internal/adapters/workspace/... ./internal/session_manager/

      - name: Test Windows Chat environment precedence
        run: go test -race -count=1 ./internal/adapters/chatdriver/processenv/ ./internal/agentlaunch/

      - name: Test Windows Chat provider process cleanup
        run: go test -race -count=1 -run '^(TestWindowsProviderJobReapsGrandchild|TestReadHostFileWaitsOutAnExclusiveHolder)$' ./internal/adapters/chatdriver/persistenthost/

      - name: Test Windows Chat hibernate and native resume
        run: go test -race -count=1 -run '^(TestPersistentClaudeACPHibernateAndNativeResume|TestCodexHibernateStopsAppServerAndNativeResumesThread)$' ./internal/adapters/chatdriver/acp/ ./internal/adapters/chatdriver/codexappserver/

      - name: Test Windows background agent commands have no console
        run: go test -race -count=1 -run '^TestBackgroundCommandHasNoConsole$' ./internal/adapters/agent/pi ./internal/adapters/agent/omp ./internal/adapters/agent/primeagent
      - name: Test Windows subprocess commands
        run: go test -race -count=1 -run 'Cloudflared|Tunnel|Command' ./internal/mobilebridge/ ./internal/process/ ./internal/adapters/systemexec/

      - name: Test Windows PowerShell installers
        run: go test -race -count=1 -v -run '^TestRunInstallScriptPowerShell' ./internal/adapters/systemexec/

      - name: Test native Goose identity
        run: go test -race -count=1 -timeout=10m ./internal/adapters/agent/binaryutil ./internal/adapters/agent/goose

      - name: Test OpenCode Windows npm shim version probe
        run: go test -race -count=1 -run '^TestResolveBinaryForMajorAcceptsSlowShim$' ./internal/adapters/agent/opencode

      - name: Test Goose readiness and inventory
        run: go test -race -count=1 -timeout=10m -run '^Test(FindInstalledBinary|WarmReadinessAndFindInstalled|PresslyGoose|Refresh|Probe|ReadinessCoordinator)' ./internal/service/agent

  cloud-build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: cloud/go.mod
          cache-dependency-path: cloud/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # -count=1 for the same reason as build-test: the restored build cache
        # would otherwise replay test results from an earlier run.
        run: go test -race -count=1 ./...

      - name: Test Expat security backport
        run: |
          docker build --target expat-build --file Dockerfile \
            --build-arg BUILDKIT_SYNTAX=mirror.gcr.io/docker/dockerfile:1 \
            --build-arg EXPAT_BUILD_IMAGE=mirror.gcr.io/library/debian:trixie-slim .

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: golangci-lint
        # v8 of the action drives golangci-lint v2 (the schema this config uses);
        # the v6 action speaks v1 CLI flags and errors against a v2 binary.
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducibility: bump intentionally. Must be built with
          # Go >= go.mod's 1.27 and read its export data (x/tools >= v0.50.0).
          version: v2.14.0
          working-directory: backend
          # Blocking on the full ruleset: the tree is clean at zero findings, so
          # any new issue fails CI rather than being grandfathered.

  sqlc-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          # sqlc runs through `go run ...@v1.31.1`, so the cached module and
          # build caches are what keep it from recompiling sqlc from scratch.
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Regenerate storage queries with pinned sqlc
        # `go run ...@v1.31.1` fetches and verifies the sqlc module; a
        # proxy/sumdb error is retried and named as network, never as drift.
        run: |
          log=$(mktemp)
          network='proxy\.golang\.org|sum\.golang\.org|stream error|INTERNAL_ERROR|ECONNRESET|ETIMEDOUT|i/o timeout|connection reset|dial tcp|TLS handshake'
          for attempt in 1 2 3; do
            status=0
            npm run sqlc >"$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eq "$network" "$log"; then
              echo "::error title=sqlc generate failed::sqlc generate failed and the log shows no network error; the code or the pinned sqlc version is at fault."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=sqlc module download failed::could not fetch the sqlc module past a network error, so generated code was never compared. This is not drift; re-run the job."
              exit 1
            fi
            echo "::warning title=sqlc module download retry::network error fetching the sqlc module (attempt $attempt/3); retrying."
            sleep $((attempt * 10))
          done

      - name: Check for generated storage drift
        # Only runs after generation succeeded, so a failure here is drift.
        run: |
          stale=$(git ls-files --others --exclude-standard -- backend/internal/storage/sqlite/gen)
          if ! git diff --exit-code -- backend/internal/storage/sqlite/gen || [ -n "$stale" ]; then
            echo "::error title=sqlc drift::generated storage code is stale; run npm run sqlc and commit backend/internal/storage/sqlite/gen."
            exit 1
          fi

  api-drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          # `go generate` compiles cmd/genspec; the module and build caches are
          # the difference between recompiling it and reusing the last run.
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenSpec bootstrap
        run: npm run openspec:check

      - name: Regenerate API spec and TS types
        run: npm run api

      # openapi.yaml drift is already caught by TestBuild_MatchesEmbedded in
      # the build-test job (go test -race ./...). Only schema.ts needs checking here.
      - name: Check for schema.ts drift
        run: git diff --exit-code -- frontend/src/api/schema.ts
