name: PR Review Leaderboard

on:
  # pull_request_target lets the workflow comment on PRs from forks. This job
  # deliberately does not check out or execute code from the pull request.
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  leaderboard:
    name: Post trailing 7-day review stats
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted leaderboard code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Test leaderboard calculation
        run: node --test .github/scripts/pr-review-leaderboard.test.mjs

      - name: Comment review leaderboard
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ github.token }}
          script: |
            const modulePath = `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-review-leaderboard.mjs`;
            const { run } = await import(modulePath);
            await run({ github, context });
