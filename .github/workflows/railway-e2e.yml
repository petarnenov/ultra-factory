name: Railway compose e2e

on:
  pull_request:
    paths:
      - "deploy/railway/**"
      - "packages/hub-bff/**"
      - "frontend/src/renderer/**"
      - "frontend/e2e/railway/**"
      - "frontend/playwright.railway.config.ts"
      - ".github/workflows/railway-e2e.yml"

permissions:
  contents: read

# A newer commit on the same PR cancels that PR's older in-flight run.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json
            packages/hub-bff/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Restore browsers before `playwright install` so it only downloads a
      # revision the cache has never held.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci --prefix frontend
      - run: npm ci
        working-directory: packages/product-ui
      - run: npm ci
        working-directory: packages/hub-bff
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix packages/hub-bff run typecheck && npm --prefix packages/hub-bff test
      - run: npm --prefix frontend run typecheck:e2e
      - run: ./deploy/railway/compose.e2e.sh
