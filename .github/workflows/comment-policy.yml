name: Code comment policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      COMMENT_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install the existing TypeScript compiler
        run: npm ci --prefix frontend --ignore-scripts
      - name: Test comment tokenization boundaries
        run: npm run comment:test
      - name: Enforce comment policy and debt baseline
        run: npm run comment:check
