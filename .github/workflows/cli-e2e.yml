name: CLI E2E

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - "test/cli/**"
      - ".github/workflows/cli-e2e.yml"

# A newer commit on the same PR cancels that PR's older in-flight run; push
# runs on main keep their own group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Primary tier: the cross-platform Go E2E suite (build tag `e2e`) runs the real
  # `ao` binary against isolated state on every OS GitHub hosts. These runners
  # exercise the real CLI and daemon on each host OS. The suite builds its own
  # binary and uses explicit AO_RUN_FILE/AO_DATA_DIR overrides plus a free port.
  # Default state-path resolution is covered by config unit tests.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          # The suite builds the whole ao binary; the caches only skip
          # compilation, never the tests below.
          cache-dependency-path: backend/go.sum

      - name: CLI E2E (native)
        # -count=1: a restored build cache also carries test results, and this
        # required check must actually run per OS, not replay an older pass.
        run: go test -tags e2e -count=1 -v ./internal/cli/...

  # Secondary hardening tier: prove that a freshly installed binary works on a
  # clean machine with no Go toolchain and no developer state. The Dockerfile
  # installs `ao` on PATH in a slim image and runs test/cli/install-check.sh.
  # --init gives a real PID-1 reaper so the daemon the check starts is reaped
  # after `stop` instead of lingering as a zombie.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Restore the build's layer cache so a re-run reuses the module download
      # layer instead of refetching it. local-ci has no cache service.
      - name: Build cache
        id: cache
        run: |
          if [ "${LOCAL_CI_LOCAL:-}" != true ]; then
            echo "from=type=gha,scope=cli-e2e" >>"$GITHUB_OUTPUT"
            echo "to=type=gha,mode=max,scope=cli-e2e" >>"$GITHUB_OUTPUT"
          fi

      - name: Build fresh-install image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/cli/Dockerfile
          load: true
          tags: ao-cli-smoke
          build-args: |
            GO_IMAGE=mirror.gcr.io/library/golang:1.27.1-bookworm
            RUNTIME_IMAGE=mirror.gcr.io/library/debian:bookworm-slim
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}

      - name: Fresh-install check (container)
        run: docker run --rm --init ao-cli-smoke
