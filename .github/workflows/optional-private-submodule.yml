name: Optional private submodule

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "private/ao-cloud"
      - "test/submodule/**"
      - ".github/workflows/optional-private-submodule.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "private/ao-cloud"
      - "test/submodule/**"
      - ".github/workflows/optional-private-submodule.yml"

# A newer commit on the same PR cancels that PR's older in-flight run; push
# runs on main keep their own group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unauthenticated-recursive-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false

      - name: Verify recursive clone skips private repository
        run: ./test/submodule/optional-private-checkout.sh
