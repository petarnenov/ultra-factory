<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<title>Sign in · Agent Orchestrator</title>
		<link rel="stylesheet" href="/_bff/login.css" />
		<script src="/_bff/login.js" defer></script>
	</head>
	<body>
		<main>
			<form id="login" novalidate>
				<h1>Sign in to Agent Orchestrator</h1>
				<label for="password">Operator password</label>
				<input id="password" name="password" type="password" autocomplete="current-password" required autofocus aria-describedby="error" />
				<p id="error" role="alert" hidden></p>
				<button type="submit">Sign in</button>
			</form>
		</main>
	</body>
</html>
